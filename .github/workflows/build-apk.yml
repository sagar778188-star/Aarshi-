name: Build OriginOS Liquid Glass Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Launcher APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Prepare Web Distribution
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Initialize or Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure AndroidManifest.xml for Home Launcher Intent
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "Checking $MANIFEST for HOME launcher category..."
          
          # Check if HOME intent category already exists
          if ! grep -q "android.intent.category.HOME" "$MANIFEST"; then
            echo "Injecting Android Home Launcher intent filters..."
            # Insert HOME and DEFAULT categories directly after the LAUNCHER category
            sed -i '/<category android:name="android.intent.category.LAUNCHER" \/>/a \                <category android:name="android.intent.category.HOME" \/>\n                <category android:name="android.intent.category.DEFAULT" \/>' "$MANIFEST"
          else
            echo "Home launcher intent category already present."
          fi
          
          echo "=== Updated Intent Filter in AndroidManifest.xml ==="
          grep -C 4 "category" "$MANIFEST" || true

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK Output
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload OriginOS Launcher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriginOS-LiquidGlass-Launcher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
